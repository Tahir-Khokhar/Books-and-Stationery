{% extends 'base.html' %}
{% block title %}Categories - Books & Stationery{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Categories</h3>
  <a class="btn btn-primary" href="{% url 'category_add' %}">Create Category</a>
</div>

<div class="table-responsive">
  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for c in categories %}
        <tr>
          <td><strong>{{ c.name }}</strong></td>
          <td>{{ c.description }}</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-primary" href="{% url 'category_edit' c.id %}">Edit</a>
            <a class="btn btn-sm btn-outline-danger" href="{% url 'category_delete' c.id %}">Delete</a>
          </td>
        </tr>
      {% empty %}
        <tr><td colspan="3" class="text-muted">No categories found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
