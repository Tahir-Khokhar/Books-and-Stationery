{% extends 'base.html' %}
{% block title %}{% if item %}Edit Item{% else %}Add Stationery Item{% endif %}{% endblock %}
{% block content %}
<h3 class="mb-3">{% if item %}Edit Stationery Item{% else %}Add Stationery Item{% endif %}</h3>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Item Name</label><input class="form-control" name="item_name" required value="{{ item.item_name|default:'' }}"></div>
    <div class="col-md-6"><label class="form-label">Brand</label><input class="form-control" name="brand" value="{{ item.brand|default:'' }}"></div>

    <div class="col-md-6"><label class="form-label">Category</label>
      <select class="form-select" name="category">
        <option value="">--</option>
        {% for c in categories %}
          <option value="{{ c.id }}" {% if item and item.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-3"><label class="form-label">Price</label><input class="form-control" name="price" value="{{ item.price|default:'0' }}" type="number" step="0.01"></div>
    <div class="col-md-3"><label class="form-label">Quantity</label><input class="form-control" name="quantity" value="{{ item.quantity|default:'0' }}" type="number"></div>

    <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3">{{ item.description|default:'' }}</textarea></div>

    <div class="col-12"><label class="form-label">Image</label><input class="form-control" type="file" name="image"></div>
  </div>

  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-outline-secondary" href="{% url 'item_list' %}">Cancel</a>
  </div>
</form>
{% endblock %}
