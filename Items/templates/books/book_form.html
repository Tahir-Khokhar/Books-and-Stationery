{% extends 'base.html' %}
{% block title %}{% if book %}Edit Book{% else %}Add Book{% endif %}{% endblock %}
{% block content %}
<h3 class="mb-3">{% if book %}Edit Book{% else %}Add Book{% endif %}</h3>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Title</label><input class="form-control" name="title" required value="{{ book.title|default:'' }}"></div>
    <div class="col-md-6"><label class="form-label">Author</label><input class="form-control" name="author" required value="{{ book.author|default:'' }}"></div>

    <div class="col-md-6"><label class="form-label">ISBN</label><input class="form-control" name="isbn" required value="{{ book.isbn|default:'' }}"></div>
    <div class="col-md-6"><label class="form-label">Publisher</label><input class="form-control" name="publisher" value="{{ book.publisher|default:'' }}"></div>

    <div class="col-md-6"><label class="form-label">Category</label>
      <select class="form-select" name="category">
        <option value="">--</option>
        {% for c in categories %}
          <option value="{{ c.id }}" {% if book and book.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-3"><label class="form-label">Price</label><input class="form-control" name="price" value="{{ book.price|default:'0' }}" type="number" step="0.01"></div>
    <div class="col-md-3"><label class="form-label">Quantity</label><input class="form-control" name="quantity" value="{{ book.quantity|default:'0' }}" type="number"></div>

    <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3">{{ book.description|default:'' }}</textarea></div>

    <div class="col-12"><label class="form-label">Cover Image</label><input class="form-control" type="file" name="cover_image"></div>
  </div>

  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-outline-secondary" href="{% url 'book_list' %}">Cancel</a>
  </div>
</form>
{% endblock %}
